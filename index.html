<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindMap</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f0f1a;
  overflow: hidden;
  color: #fff;
}

/* Toolbar */
#bar {
  position: fixed; top: 0; left: 0; right: 0; height: 44px;
  background: #1a1a2e; border-bottom: 1px solid #2a2a4a;
  display: flex; align-items: center; padding: 0 12px; gap: 6px; z-index: 100;
}
#bar .title { font-weight: 700; font-size: 16px; color: #ff6b8a; margin-right: 12px; }
.tb {
  background: #2a2a4a; border: none; color: #ccc; padding: 5px 12px;
  border-radius: 6px; cursor: pointer; font-size: 12px;
}
.tb:hover { background: #3a3a5a; color: #fff; }
.tb.red { color: #ff6b8a; }
.tb.red:hover { background: #ff6b8a; color: #fff; }
.spacer { flex: 1; }
.dot {
  width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: border-color 0.15s;
}
.dot.on { border-color: #fff; }
.sep { width: 1px; height: 20px; background: #2a2a4a; margin: 0 4px; }

/* Canvas area */
#world {
  position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
  cursor: grab; outline: none;
}
#world.dragging { cursor: grabbing; }

/* Line canvas */
#lines {
  position: absolute; top: 0; left: 0; pointer-events: none;
}

/* Nodes layer */
#nodes {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
}

/* Node */
.n {
  position: absolute; padding: 8px 16px; border-radius: 10px;
  font-size: 13px; font-weight: 500; text-align: center;
  cursor: pointer; white-space: nowrap; min-width: 80px;
  transition: box-shadow 0.1s;
  user-select: none;
}
.n:hover { filter: brightness(1.15); }
.n.sel { box-shadow: 0 0 0 2.5px #fff; }
.n.root { font-size: 16px; font-weight: 700; padding: 10px 22px; border-radius: 14px; }

/* + button on hover */
.n .plus {
  position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%;
  background: #ff6b8a; color: #fff; border: 2px solid #0f0f1a;
  font-size: 14px; line-height: 14px; cursor: pointer;
  display: none; align-items: center; justify-content: center;
}
.n:hover .plus { display: flex; }

/* Edit input */
.n input {
  background: transparent; border: none; color: inherit; font: inherit;
  text-align: center; outline: none; width: 100%; min-width: 60px;
}

/* Zoom label */
#zlbl {
  position: fixed; bottom: 10px; right: 12px;
  font-size: 11px; color: #555; z-index: 50;
}

/* Toast */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: #1a1a2e; border: 1px solid #2a2a4a;
  padding: 8px 20px; border-radius: 8px; font-size: 12px; color: #aaa;
  transition: transform 0.25s; z-index: 150;
}
#toast.on { transform: translateX(-50%) translateY(0); }

/* Hint on first load */
#hint {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: #444; z-index: 50; text-align: center;
}
</style>
</head>
<body>

<div id="bar">
  <span class="title">MindMap</span>
  <button class="tb" onclick="addChild()">+ Child</button>
  <button class="tb" onclick="addSibling()">+ Sibling</button>
  <button class="tb red" onclick="delNode()">Delete</button>
  <div class="sep"></div>
  <div class="dot on" style="background:#ff6b8a" onclick="pickColor('#ff6b8a',this)"></div>
  <div class="dot" style="background:#4a9eff" onclick="pickColor('#4a9eff',this)"></div>
  <div class="dot" style="background:#a855f7" onclick="pickColor('#a855f7',this)"></div>
  <div class="dot" style="background:#22c55e" onclick="pickColor('#22c55e',this)"></div>
  <div class="dot" style="background:#f59e0b" onclick="pickColor('#f59e0b',this)"></div>
  <div class="sep"></div>
  <button class="tb" onclick="fitView()">Fit</button>
  <button class="tb" onclick="saveFile()">Save</button>
  <button class="tb" onclick="document.getElementById('lf').click()">Load</button>
  <input type="file" id="lf" accept=".json" style="display:none" onchange="loadFile(event)">
  <button class="tb" onclick="newMap()">New</button>
  <div class="spacer"></div>
  <button class="tb" onclick="showHelp()">?</button>
</div>

<div id="world" tabindex="0">
  <canvas id="lines"></canvas>
  <div id="nodes"></div>
</div>

<div id="zlbl">100%</div>
<div id="toast"></div>
<div id="hint">Click a node, then press <b>Tab</b> to add children &middot; <b>Enter</b> for siblings &middot; Double-click to edit</div>

<script>
// State
let N = []; // nodes: {id, text, x, y, pid, color, root}
let nid = 1, sel = null, color = '#ff6b8a';
let undo = [], redo_ = [];

// Pan/zoom
let px = 0, py = 0, zm = 1;
let panning = false, psx, psy;
let dragging = false, did = null, dox, doy;
let editing = false;

const world = document.getElementById('world');
const nodesEl = document.getElementById('nodes');
const lineCanvas = document.getElementById('lines');
const ctx = lineCanvas.getContext('2d');

// ---- Init ----
function init() {
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const s = localStorage.getItem('mm');
  if (s) {
    try {
      const d = JSON.parse(s);
      N = d.N || []; nid = d.nid || 1;
      if (N.length) { save(); draw(); fitView(); return; }
    } catch(e) {}
  }
  fresh();
}

function fresh() {
  N = []; nid = 1; sel = null;
  const cx = 2000, cy = 2000;
  N.push({ id: nid++, text: 'My Ideas', x: cx, y: cy, pid: null, color: '#ff6b8a', root: true });
  sel = 1;
  save(); draw(); fitView();
}

function resizeCanvas() {
  lineCanvas.width = world.offsetWidth;
  lineCanvas.height = world.offsetHeight;
  drawLines();
}

// ---- Save/Undo ----
function save() {
  undo.push(JSON.stringify({ N, nid }));
  if (undo.length > 40) undo.shift();
  redo_ = [];
  localStorage.setItem('mm', JSON.stringify({ N, nid }));
}

function doUndo() {
  if (undo.length < 2) return;
  redo_.push(undo.pop());
  const d = JSON.parse(undo[undo.length - 1]);
  N = d.N; nid = d.nid; sel = null; draw(); toast('Undo');
}

function doRedo() {
  if (!redo_.length) return;
  const d = JSON.parse(redo_.pop());
  undo.push(JSON.stringify(d));
  N = d.N; nid = d.nid; sel = null; draw(); toast('Redo');
}

// ---- Draw ----
function draw() {
  // Clear DOM nodes
  nodesEl.innerHTML = '';

  N.forEach(n => {
    const d = document.createElement('div');
    d.className = 'n' + (n.root ? ' root' : '') + (n.id === sel ? ' sel' : '');
    d.dataset.id = n.id;
    d.style.left = n.x + 'px';
    d.style.top = n.y + 'px';
    d.style.background = n.color;
    d.style.color = isLight(n.color) ? '#1a1a2e' : '#fff';
    d.textContent = n.text;

    // Plus button
    const p = document.createElement('button');
    p.className = 'plus';
    p.textContent = '+';
    p.onmousedown = (e) => { e.stopPropagation(); sel = n.id; addChild(); };
    d.appendChild(p);

    d.onmousedown = (e) => nodeDown(e, n.id);
    d.ondblclick = (e) => { e.stopPropagation(); editNode(n.id); };

    nodesEl.appendChild(d);
  });

  updateTransform();
  drawLines();
}

function drawLines() {
  ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
  ctx.lineCap = 'round';

  N.forEach(n => {
    if (!n.pid) return;
    const p = N.find(x => x.id === n.pid);
    if (!p) return;

    const pe = nodesEl.querySelector(`[data-id="${p.id}"]`);
    const ce = nodesEl.querySelector(`[data-id="${n.id}"]`);
    if (!pe || !ce) return;

    // Get positions in screen space
    const x1 = (p.x + pe.offsetWidth / 2) * zm + px;
    const y1 = (p.y + pe.offsetHeight / 2) * zm + py;
    const x2 = (n.x + ce.offsetWidth / 2) * zm + px;
    const y2 = (n.y + ce.offsetHeight / 2) * zm + py;

    const mx = (x1 + x2) / 2;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 2.5 * zm;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function updateTransform() {
  nodesEl.style.transform = `translate(${px}px, ${py}px) scale(${zm})`;
}

// ---- Pan & Zoom ----
world.addEventListener('mousedown', (e) => {
  if (e.target === world || e.target === lineCanvas) {
    panning = true;
    psx = e.clientX - px;
    psy = e.clientY - py;
    world.classList.add('dragging');
    sel = null;
    draw();
    world.focus();
  }
});

window.addEventListener('mousemove', (e) => {
  if (panning) {
    px = e.clientX - psx;
    py = e.clientY - psy;
    updateTransform();
    drawLines();
  }
  if (dragging && did) {
    const n = N.find(x => x.id === did);
    if (n) {
      n.x = (e.clientX - px) / zm - dox;
      n.y = (e.clientY - 44 - py) / zm - doy;
      const el = nodesEl.querySelector(`[data-id="${did}"]`);
      if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
      drawLines();
    }
  }
});

window.addEventListener('mouseup', () => {
  if (panning) { panning = false; world.classList.remove('dragging'); }
  if (dragging) { dragging = false; did = null; save(); }
});

world.addEventListener('wheel', (e) => {
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.9 : 1.1;
  const nz = Math.max(0.2, Math.min(3, zm * d));
  const r = world.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  px = mx - (mx - px) * (nz / zm);
  py = my - (my - py) * (nz / zm);
  zm = nz;
  updateTransform();
  drawLines();
  document.getElementById('zlbl').textContent = Math.round(zm * 100) + '%';
}, { passive: false });

function nodeDown(e, id) {
  e.stopPropagation();
  sel = id;
  draw();
  world.focus();

  const n = N.find(x => x.id === id);
  if (n) {
    dragging = true; did = id;
    dox = (e.clientX - px) / zm - n.x;
    doy = (e.clientY - 44 - py) / zm - n.y;
  }
}

// ---- Add / Delete ----
function addChild() {
  const p = N.find(x => x.id === sel);
  if (!p) { toast('Select a node first'); return; }

  const kids = N.filter(x => x.pid === p.id);
  const el = nodesEl.querySelector(`[data-id="${p.id}"]`);
  const pw = el ? el.offsetWidth : 120;

  const child = {
    id: nid++, text: 'New idea',
    x: p.x + pw + 60,
    y: p.y + kids.length * 60 - kids.length * 25,
    pid: p.id, color: p.color, root: false
  };
  N.push(child);
  sel = child.id;
  save(); draw();
  setTimeout(() => editNode(child.id), 30);
  hideHint();
}

function addSibling() {
  const c = N.find(x => x.id === sel);
  if (!c || !c.pid) { toast('Select a non-root node'); return; }

  const sib = {
    id: nid++, text: 'New idea',
    x: c.x, y: c.y + 60,
    pid: c.pid, color: c.color, root: false
  };
  N.push(sib);
  sel = sib.id;
  save(); draw();
  setTimeout(() => editNode(sib.id), 30);
}

function delNode() {
  const n = N.find(x => x.id === sel);
  if (!n) return;
  if (n.root) { toast("Can't delete root"); return; }

  const del = new Set();
  function collect(id) { del.add(id); N.filter(x => x.pid === id).forEach(c => collect(c.id)); }
  collect(n.id);
  sel = n.pid;
  N = N.filter(x => !del.has(x.id));
  save(); draw();
}

// ---- Edit ----
function editNode(id) {
  const n = N.find(x => x.id === id);
  if (!n) return;
  const el = nodesEl.querySelector(`[data-id="${id}"]`);
  if (!el) return;

  editing = true;
  const inp = document.createElement('input');
  inp.value = n.text;
  inp.style.color = el.style.color;
  el.textContent = '';
  el.appendChild(inp);
  inp.focus();
  inp.select();

  const done = () => {
    editing = false;
    n.text = inp.value.trim() || n.text;
    save(); draw();
    world.focus();
  };

  inp.addEventListener('blur', done);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape') { inp.value = n.text; inp.blur(); }
    e.stopPropagation();
  });
}

// ---- Color ----
function pickColor(c, el) {
  color = c;
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('on'));
  if (el) el.classList.add('on');
  const n = N.find(x => x.id === sel);
  if (n) { n.color = c; save(); draw(); }
}

// ---- Keyboard ----
world.addEventListener('keydown', (e) => {
  if (editing) return;

  if (e.key === 'Tab') {
    e.preventDefault();
    e.stopPropagation();
    addChild();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    addSibling();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    delNode();
  } else if (e.key === 'F2' || e.key === ' ') {
    e.preventDefault();
    if (sel) editNode(sel);
  } else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); doUndo();
  } else if (e.key === 'y' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); doRedo();
  } else if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); saveFile();
  } else if (e.key.startsWith('Arrow')) {
    e.preventDefault(); nav(e.key);
  }
}, true);

// Also capture Tab at document level to prevent browser from stealing it
document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab' && !editing) {
    e.preventDefault();
  }
}, true);

function nav(k) {
  const c = N.find(x => x.id === sel);
  if (!c) { sel = N[0]?.id; draw(); return; }

  if (k === 'ArrowLeft' && c.pid) { sel = c.pid; draw(); }
  else if (k === 'ArrowRight') {
    const kids = N.filter(x => x.pid === c.id);
    if (kids.length) { sel = kids[0].id; draw(); }
  } else if (k === 'ArrowUp' || k === 'ArrowDown') {
    if (!c.pid) return;
    const sibs = N.filter(x => x.pid === c.pid);
    const i = sibs.findIndex(x => x.id === c.id);
    if (k === 'ArrowUp' && i > 0) { sel = sibs[i-1].id; draw(); }
    if (k === 'ArrowDown' && i < sibs.length - 1) { sel = sibs[i+1].id; draw(); }
  }
}

// ---- Fit View ----
function fitView() {
  if (!N.length) return;
  requestAnimationFrame(() => {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    N.forEach(n => {
      const el = nodesEl.querySelector(`[data-id="${n.id}"]`);
      const w = el ? el.offsetWidth : 120, h = el ? el.offsetHeight : 36;
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + w); y2 = Math.max(y2, n.y + h);
    });
    const cw = world.offsetWidth, ch = world.offsetHeight;
    const bw = x2 - x1 + 120, bh = y2 - y1 + 120;
    zm = Math.min(cw / bw, ch / bh, 1.2);
    zm = Math.max(0.3, zm);
    px = (cw - bw * zm) / 2 - x1 * zm + 60 * zm;
    py = (ch - bh * zm) / 2 - y1 * zm + 60 * zm;
    updateTransform(); drawLines();
    document.getElementById('zlbl').textContent = Math.round(zm * 100) + '%';
  });
}

// ---- File ops ----
function saveFile() {
  const b = new Blob([JSON.stringify({ N, nid }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'mindmap.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Saved!');
}

function loadFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      N = d.N || []; nid = d.nid || 1; sel = null;
      save(); draw(); fitView(); toast('Loaded!');
    } catch(er) { toast('Bad file'); }
  };
  r.readAsText(f);
  e.target.value = '';
}

function newMap() {
  if (!confirm('Start fresh?')) return;
  localStorage.removeItem('mm');
  undo = []; redo_ = [];
  fresh();
  toast('New map');
}

// ---- Helpers ----
function isLight(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 160;
}

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1500);
}

function hideHint() { const h = document.getElementById('hint'); if (h) h.remove(); }

function showHelp() {
  alert(
    'Shortcuts:\n\n' +
    'Tab → Add child\n' +
    'Enter → Add sibling\n' +
    'Delete → Remove node\n' +
    'Double-click / Space → Edit text\n' +
    'Arrow keys → Navigate\n' +
    'Ctrl+Z / Ctrl+Y → Undo / Redo\n' +
    'Ctrl+S → Save file\n' +
    'Scroll → Zoom\n' +
    'Drag background → Pan\n' +
    'Drag node → Move'
  );
}

// Focus world so keyboard works immediately
world.focus();
init();
</script>
</body>
</html>
